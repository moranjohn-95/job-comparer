name: Project checks

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flake8
        run: python -m pip install flake8==7.4.1
      - name: Lint project Python files
        run: python -m flake8 . --exclude .venv,node_modules --jobs 1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: job_comparer_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: job_comparer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_comparer_test -d job_comparer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      # The development placeholder is never created or connected to.
      POSTGRES_DB: job_comparer_unused
      POSTGRES_TEST_DB: job_comparer_test
      DATABASE_URL: postgresql+psycopg://job_comparer_test:ci-test-only@127.0.0.1:5432/job_comparer_unused
      TEST_DATABASE_URL: postgresql+psycopg://job_comparer_test:ci-test-only@127.0.0.1:5432/job_comparer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend with isolated PostgreSQL and mocked services
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Test health status
        run: npm test
