name: Python lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flake8
        run: python -m pip install flake8==7.4.1
      - name: Lint project Python files
        run: python -m flake8 . --exclude .venv --jobs 1
